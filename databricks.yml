bundle:
  name: clinical_study_onboarding

include:
  - resources/*.yml

sync:
  exclude:
    - data/**
    - app/**
    - scripts/**
    - demo_assets/**
    - docs/**
    - "*.zip"
    - .env

variables:
  catalog:
    description: Unity Catalog catalog for the demo
    default: clinical_demo
  schema:
    description: Schema that holds volumes, bronze/silver/gold tables
    default: study_onboarding
  warehouse_id:
    description: SQL warehouse ID used by ai_query, Genie and the app (set via 00_install.py or --var)
    default: ""
  llm_endpoint:
    description: Foundation model endpoint used to write study insight narratives
    default: databricks-claude-sonnet-4-5
  portfolio_synced_table:
    description: Lakebase synced table (lakebase_catalog.schema.table) that serves the portfolio page
    default: study_hub_lakebase.serving.study_portfolio
  lakebase_catalog:
    description: Unity Catalog catalog that exposes the Lakebase database (read-only), used to read data quality review decisions
    default: study_hub_lakebase
  alert_email:
    description: >-
      Recipient of job failure, duration and data quality alerts. Defaults to the deploying user, so no address is
      committed to the repo. Override with --var="alert_email=<address>".
    default: ${workspace.current_user.userName}
  ai_accuracy_threshold:
    description: Minimum AI data modelling accuracy (percent of mapped values correct) to continue without a human
    default: "99.9"
  ai_max_retries:
    description: How many times the AI data modelling step retries (with validation feedback) before the manual fallback
    default: "3"
  job_duration_warning_seconds:
    description: Send a warning when an onboarding run takes longer than this (typical run is about 5 minutes)
    default: "600"
  job_timeout_seconds:
    description: Hard timeout for onboarding and remediation runs
    default: "1800"

targets:
  # Default: deploy into the *current* workspace (Git Folder / 00_install.py / Genie Code).
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
