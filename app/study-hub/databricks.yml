bundle:
  name: study-hub

variables:
  sql_warehouse_id:
    description: SQL warehouse ID (pass --var from 00_install.py)
  files_path:
    description: Landing volume path for study packages
    default: /Volumes/clinical_demo/study_onboarding/landing
  files_id:
    description: Landing volume UC name catalog.schema.volume
    default: clinical_demo.study_onboarding.landing
  job_id:
    description: Study onboarding Lakeflow Job ID from the root bundle
  postgres_branch:
    description: Lakebase Postgres branch resource name
    default: projects/study-hub/branches/production
  postgres_database:
    description: Lakebase Postgres database resource name
    default: projects/study-hub/branches/production/databases/databricks-postgres
  genie_space_id:
    description: Genie space ID (created by 00_install.py)
  genie_space_name:
    description: Genie space display name
    default: Study Insights

resources:
  apps:
    app:
      name: "study-hub"
      description: "Clinical Study Hub - clinical study onboarding with approval workflow, insights and Genie"
      source_code_path: ./
      user_api_scopes:
        - genie
      lifecycle:
        started: true
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: job
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace: {}
