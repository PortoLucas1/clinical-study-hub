resources:
  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.study_onboarding.name}
      name: landing
      volume_type: MANAGED
      comment: Study packages (zip) uploaded from the Study Hub app, waiting for approval
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.study_onboarding.name}
      name: raw
      volume_type: MANAGED
      comment: Unzipped study files, laid out as <study_id>/<domain>/<submission_id>__<file>
    samples:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.study_onboarding.name}
      name: samples
      volume_type: MANAGED
      comment: Synthetic study packages for demos
